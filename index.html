<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Engine Renderer</title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
		canvas { display: block; width: 100vw; height: 100vh; }
		#ab { position: fixed; top: 10px; right: 10px; display: flex; gap: 6px; font-family: sans-serif; }
		#ab button { padding: 6px 12px; border: 1px solid #555; background: #222; color: #ccc;
			cursor: pointer; border-radius: 4px; font-size: 13px; }
		#ab button.active { background: #2a7; color: #000; border-color: #2a7; font-weight: bold; }
		#stats { position: fixed; top: 10px; left: 10px; margin: 0; padding: 10px 14px;
			background: rgba(0,0,0,0.72); color: #cfe; font: 12px/1.55 ui-monospace, monospace;
			border-radius: 6px; white-space: pre; }
		#stats[hidden] { display: none; }
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<!-- source toggle: reloads with ?src=. avif + jpeg are local (fair); jpeg-cdn is basemap.at -->
	<div id="ab">
		<button data-src="avif">AVIF (github)</button>
		<button data-src="jpeg">JPEG (github)</button>
		<button data-src="jpeg-cdn">JPEG (TU)</button>
	</div>
	<!-- tile stats panel, revealed by the Odin scheduler once the block finishes loading -->
	<pre id="stats" hidden></pre>

	<!-- Tile decode worker (one instance per pool slot). NOT executed inline: the type is
	     non-JS so the browser skips it; the main script reads its textContent verbatim and
	     spins Workers from a Blob URL. Verbatim read = regexes survive (no template-literal
	     escape mangling). Fetches + decodes a tile fully off the main thread, then transfers
	     the decoded frame back for GPU upload. performance.now() deltas here are durations
	     within this context only -- valid as ms, not comparable to main-thread timestamps. -->
	<script type="text/js-worker" id="tile-worker">
		self.onmessage = async (e) => {
			const { id, url } = e.data;
			const t0 = performance.now();
			try {
				const r = await fetch(url, { cache: "no-store" });
				if (!r.ok) throw r.status;
				const buf = await r.arrayBuffer();
				const tFetch = performance.now() - t0;
				const bytes = buf.byteLength;
				const data = new Uint8Array(buf);

				// Pick a mime type ImageDecoder understands: response header, else URL extension.
				let type = "";
				const ct = r.headers.get("content-type");
				if (ct && ct.startsWith("image/")) type = ct.split(";")[0].trim();
				if (!type) {
					if (/\.avif(\?|$)/i.test(url)) type = "image/avif";
					else if (/\.jpe?g(\?|$)/i.test(url)) type = "image/jpeg";
					else if (/\.png(\?|$)/i.test(url)) type = "image/png";
					else if (/\.webp(\?|$)/i.test(url)) type = "image/webp";
				}

				let useDecoder = false;
				if (type && ("ImageDecoder" in self)) {
					try { useDecoder = await ImageDecoder.isTypeSupported(type); } catch (_) { useDecoder = false; }
				}

				const t1 = performance.now();
				let frame;
				if (useDecoder) {
					// Native codec threads (dav1d for AVIF, no wasm). Yields a VideoFrame (BGRA8).
					const dec = new ImageDecoder({ data, type });
					frame = (await dec.decode()).image;
					dec.close();
				} else {
					// Fallback: createImageBitmap (also available in workers). Same color flags
					// as the original main-thread path -- raw sRGB bytes, no ICC/color mgmt.
					const blob = new Blob([data], { type: type || undefined });
					frame = await createImageBitmap(blob,
						{ colorSpaceConversion: "none", premultiplyAlpha: "none", imageOrientation: "none" });
				}
				const decodeMs = performance.now() - t1;

				// Transfer the frame handle (not a pixel copy) back to main for upload.
				self.postMessage({ id, ok: 1, bytes, tFetch, decodeMs, frame }, [frame]);
			} catch (err) {
				self.postMessage({ id, ok: 0, err: String(err) });
			}
		};
	</script>

	<!-- Odin js_wasm32 runtime: runWasm + WasmMemoryInterface (attached to window.odin) -->
	<script src="odin.js"></script>
	<!-- vendor:wgpu web backend: WebGPUInterface (browser WebGPU), also on window.odin -->
	<script src="wgpu.js"></script>
	<script>
		if (!navigator.gpu) {
			document.body.innerHTML =
				"<p style='color:#eee;font-family:sans-serif'>WebGPU is not available in this browser.</p>";
			throw new Error("WebGPU not supported");
		}
		// Shared memory interface between the Odin runtime and the wgpu backend.
		const wmi = new odin.WasmMemoryInterface();
		const webgpu = new odin.WebGPUInterface(wmi);
		// JS owns the linear memory (engine.wasm is built with --import-memory) and the
		// wgpu interface, so both survive re-instantiation -> app state + GPU handles persist
		// across a hot swap. Bump `initial` if instantiation throws a memory-minimum error.
		const memory = new WebAssembly.Memory({ initial: 1024, maximum: 16384 });
		wmi.setMemory(memory);

		// ---- Tile decode concurrency knob -------------------------------------------------
		// 0     -> inline: decode on the main thread via async ImageDecoder (concurrent, but
		//          subject to the browser's internal codec-thread pool). This is the baseline.
		// N > 0  -> pool of N workers, each doing fetch + decode off-thread; main thread only
		//          uploads. Try navigator.hardwareConcurrency - 1. Reload to apply (A/B the two).
		// The GPU upload (copyExternalImageToTexture) always stays on the main thread since it
		// owns the queue -- so if uploadMs dominates, the pool won't move total; the texture
		// format / batching is the lever then, not more decode threads.
		const TILE_DECODE_WORKERS = 4;
		// -----------------------------------------------------------------------------------

		let hotReload = false;
		let webfileBuf = null; // bytes staged between webfile_fetch and webfile_copy
		const webfileStash = {}; // id -> Uint8Array, staged between async fetch resolve and webfile_drain

		// Cache ImageDecoder.isTypeSupported() per mime type (inline path). Resolves false when
		// WebCodecs is unavailable or the type is unsupported -> createImageBitmap fallback.
		const decoderSupport = {};
		function canDecode(type) {
			if (!type || !("ImageDecoder" in window)) return Promise.resolve(false);
			if (!(type in decoderSupport))
				decoderSupport[type] = ImageDecoder.isTypeSupported(type).catch(() => false);
			return decoderSupport[type];
		}

		// ---- Worker pool (used only when TILE_DECODE_WORKERS > 0) --------------------------
		let tilePool = null;
		const tilePending = new Map(); // id -> { texId, queueId, layer } awaiting a decoded frame

		function initTilePool(n) {
			const src = document.getElementById("tile-worker").textContent;
			const blobUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
			tilePool = [];
			for (let i = 0; i < n; i++) {
				const w = new Worker(blobUrl);
				w.inflight = 0;
				w.onmessage = (e) => {
					const m = e.data;
					w.inflight--;
					const p = tilePending.get(m.id); tilePending.delete(m.id);
					if (!m.ok) {
						console.error("tile worker", m.err);
						wmi.exports.tile_uploaded(m.id, 0, 0, 0, 0, 0, ctxPtr);
						return;
					}
					// Upload on the main thread (owns the queue). frame is a VideoFrame or an
					// ImageBitmap; both are valid copyExternalImageToTexture sources.
					const t2 = performance.now();
					const tex = webgpu.textures.get(p.texId);
					const queue = webgpu.queues.get(p.queueId);
					const fw = m.frame.displayWidth ?? m.frame.width;
					const fh = m.frame.displayHeight ?? m.frame.height;
					queue.copyExternalImageToTexture(
						{ source: m.frame },
						{ texture: tex, origin: [0, 0, p.layer] },
						[fw, fh, 1]);
					m.frame.close();
					const uploadMs = performance.now() - t2;
					wmi.exports.tile_uploaded(m.id, 1, m.bytes, m.tFetch, m.decodeMs, uploadMs, ctxPtr);
				};
				tilePool.push(w);
			}
		}

		// Least-busy dispatch. Keeps per-worker in-flight counts balanced so no core idles
		// while another worker's queue backs up.
		function dispatchTile(id, url, texId, queueId, layer) {
			let best = tilePool[0];
			for (const w of tilePool) if (w.inflight < best.inflight) best = w;
			best.inflight++;
			tilePending.set(id, { texId, queueId, layer });
			best.postMessage({ id, url });
		}
		// -----------------------------------------------------------------------------------

		const imports = {
			...odin.setupDefaultImports(wmi, null, memory),
			wgpu: webgpu.getInterface(),
			hot: { is_reload: () => (hotReload ? 1 : 0) }, // read by Odin's foreign `is_reload`
			webfile: {
				// Synchronous XHR of a server-local path. Stashes bytes, returns length (-1 on error).
				// Sync XHR forbids responseType="arraybuffer", so read binary via the
				// x-user-defined charset trick and mask each char back to a byte.
				webfile_fetch: (ptr, len) => {
					const path = wmi.loadString(ptr, len);
					try {
						const xhr = new XMLHttpRequest();
						xhr.open("GET", path, false); // false = synchronous
						xhr.overrideMimeType("text/plain; charset=x-user-defined");
						xhr.send();
						if (xhr.status !== 200 && xhr.status !== 0) { webfileBuf = null; return -1; }
						const s = xhr.responseText;
						const b = new Uint8Array(s.length);
						for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xff;
						webfileBuf = b;
						return b.length;
					} catch (e) { console.error("webfile_fetch", path, e); webfileBuf = null; return -1; }
				},
				// buf: []byte arrives as (ptr, len) -- fill it from the stash, then clear.
				webfile_copy: (ptr, len) => {
					wmi.loadU8Array(ptr, len).set(webfileBuf);
					webfileBuf = null;
				},
				// Async fetch; on settle, stash bytes by id and call the wasm trampoline
				// (JS appends ctxPtr, like step). wmi.exports/ctxPtr are read live, so after
				// a hot swap this hits the new instance -- which drops unknown ids.
				webfile_request: (id, ptr, len) => {
					const path = wmi.loadString(ptr, len);
					fetch(path, { cache: "no-store" })
						.then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
						.then(buf => {
							const b = new Uint8Array(buf);
							webfileStash[id] = b;
							wmi.exports.webfile_deliver(id, b.length, 1, ctxPtr);
							delete webfileStash[id];
						})
						.catch(e => {
							console.error("webfile_request", path, e);
							wmi.exports.webfile_deliver(id, 0, 0, ctxPtr);
						});
				},
				// Copy the stashed async bytes for `id` into buf (called during deliver).
				webfile_drain: (id, ptr, len) => {
					wmi.loadU8Array(ptr, len).set(webfileStash[id]);
				},
			},
			tiles: {
				// Fetch a tile, decode it off the main thread, and copy it straight into the
				// Odin-created texture array -- pixels never touch wasm. texId/queueId are
				// wgpu.js object ids; resolve them via the object managers.
				//
				// Two modes (see TILE_DECODE_WORKERS): pool -> dispatch to a worker (fetch +
				// decode off-thread, upload on return); inline -> ImageDecoder here, falling
				// back to createImageBitmap. Fetching bytes then decoding keeps the frame
				// origin-clean (no canvas taint), so cross-origin OSM/basemap tiles upload fine.
				//
				// NOTE: ImageDecoder yields a BGRA8 VideoFrame; if the destination texture array
				// is RGBA8 the upload pays a swizzle. Match the texture format to bgra8unorm(-srgb)
				// on the Odin side to hit the copyExternalImageToTexture memcpy fast path.
				tile_upload: (id, urlPtr, urlLen, texId, queueId, layer) => {
					const url = wmi.loadString(urlPtr, urlLen);

					// Pool mode: hand off to a worker; upload happens in its onmessage.
					if (tilePool) { dispatchTile(id, url, texId, queueId, layer); return; }

					// Inline mode. Time each phase (ms) + byte size back to the Odin scheduler,
					// which aggregates the stats. Phases: fetch (network), decode, upload.
					const t0 = performance.now();
					let bytes = 0, tFetch = 0;
					fetch(url, { cache: "no-store" })
						.then(r => r.ok
							? r.arrayBuffer().then(buf => ({ buf, ct: r.headers.get("content-type") }))
							: Promise.reject(r.status))
						.then(async ({ buf, ct }) => {
							tFetch = performance.now() - t0;
							bytes = buf.byteLength;
							const data = new Uint8Array(buf);

							let type = (ct && ct.startsWith("image/")) ? ct.split(";")[0].trim() : "";
							if (!type) {
								if (/\.avif(\?|$)/i.test(url)) type = "image/avif";
								else if (/\.jpe?g(\?|$)/i.test(url)) type = "image/jpeg";
								else if (/\.png(\?|$)/i.test(url)) type = "image/png";
								else if (/\.webp(\?|$)/i.test(url)) type = "image/webp";
							}

							const t1 = performance.now();
							let source, decodeMs, cleanup;

							if (await canDecode(type)) {
								// Fast path: decode off-thread on the browser's codec threads.
								const dec = new ImageDecoder({ data, type });
								const { image: frame } = await dec.decode();
								decodeMs = performance.now() - t1;
								source = frame;
								cleanup = () => { frame.close(); dec.close(); };
							} else {
								// Fallback: createImageBitmap from a Blob. colorSpaceConversion:"none"
								// stops Chrome from applying ICC/color management on decode -- we want
								// the raw sRGB tile bytes; the sRGB texture format handles the decode.
								// (See Castano, "Image Loading on the Web".)
								const blob = new Blob([data], { type: type || undefined });
								const bmp = await createImageBitmap(blob,
									{ colorSpaceConversion: "none", premultiplyAlpha: "none", imageOrientation: "none" });
								decodeMs = performance.now() - t1;
								source = bmp;
								cleanup = () => bmp.close();
							}

							const t2 = performance.now();
							const tex = webgpu.textures.get(texId);
							const queue = webgpu.queues.get(queueId);
							const w = source.displayWidth ?? source.width;
							const h = source.displayHeight ?? source.height;
							queue.copyExternalImageToTexture(
								{ source },
								{ texture: tex, origin: [0, 0, layer] },
								[w, h, 1]);
							cleanup();
							const uploadMs = performance.now() - t2;
							wmi.exports.tile_uploaded(id, 1, bytes, tFetch, decodeMs, uploadMs, ctxPtr);
						})
						.catch(e => {
							console.error("tile_upload", url, e);
							wmi.exports.tile_uploaded(id, 0, 0, 0, 0, 0, ctxPtr);
						});
				},
				// Source select from ?src=: jpeg -> 1 (local JPEG, fair), jpeg-cdn -> 2 (basemap.at),
				// anything else -> 0 (local AVIF, default).
				tile_source: () => {
					const s = new URLSearchParams(location.search).get("src");
					return s === "jpeg" ? 1 : (s === "jpeg-cdn" ? 2 : 0);
				},
				// The Odin scheduler calls this with the formatted stats block once the tile block
				// finishes loading; reveal the on-page panel.
				tiles_stats: (ptr, len) => {
					const el = document.getElementById("stats");
					el.textContent = wmi.loadString(ptr, len);
					el.hidden = false;
				},
				// Monotonic clock (ms) for the scheduler's wall-clock total.
				tiles_now: () => performance.now(),
			},
		};

		// One persistent RAF loop across all module swaps; it always calls the *current*
		// instance via wmi.exports. odin.js's env callbacks read wmi.exports live too, so
		// setExports() repoints every host callback at the new instance.
		let ctxPtr = 0, rafId = 0, prev;
		function loop(t) {
			if (prev === undefined) prev = t;
			const dt = (t - prev) * 0.001; prev = t;
			wmi.exports.step(dt, ctxPtr);
			rafId = requestAnimationFrame(loop);
		}

		async function boot(hot) {
			hotReload = hot;
			const bytes = await (await fetch("engine.wasm", { cache: "no-store" })).arrayBuffer();
			// Serialize the persistent State out of the OLD instance before we throw it
			// away. One blob, serialized by field name (survives layout changes) -- the gpu
			// handles ride inside it now, same as the native host across a DLL swap.
			let savedState = null;
			if (hot) {
				const e = wmi.exports;
				const n = e.state_save(ctxPtr); // serialize State (gpu included) in the old instance
				savedState = wmi.loadU8Array(e.state_save_ptr(ctxPtr), n).slice();
			}
			const { instance } = await WebAssembly.instantiate(bytes, imports);
			ctxPtr = instance.exports.default_context_ptr();
			wmi.setExports(instance.exports);
			instance.exports._start(); // Odin init + main -> run() (bails early if hot)
			// Steps below run synchronously after _start (no await), so no RAF frame sees a
			// half-restored persist.
			if (hot) {
				const e = instance.exports;
				// State (gpu handles included) is remapped by field name, so a layout change
				// needs no guard -- new fields default, the opaque wgpu ids copy through.
				const buf = e.state_load_buf(savedState.length, ctxPtr);
				wmi.loadU8Array(buf, savedState.length).set(savedState);
				e.state_load(ctxPtr);
				e.hot_resume(ctxPtr);
			}
			if (!rafId) rafId = requestAnimationFrame(loop);
		}

		// dev livereload: swap the module in place when engine.wasm changes (served by serve.py).
		// ponytail: harmless in prod -- a HEAD every 500ms that never triggers a swap. Strip if it bugs you.
		const WASM_HOT_RELOAD = false; // toggle dev livereload
		let stamp;
		if (WASM_HOT_RELOAD) setInterval(async () => {
			const m = (await fetch("engine.wasm", { method: "HEAD", cache: "no-store" }))
				.headers.get("Last-Modified");
			if (stamp && m !== stamp) {
				// Drop stale window listeners (they hold the old instance's callback indices);
				// the new run()/hot_resume re-adds them against the fresh instance.
				for (const [k, l] of wmi.listenerMap) {
					window.removeEventListener(k.split("-data:")[0].split("-").slice(1).join("-"), l);
				}
				wmi.listenerMap.clear();
				try { await boot(true); } catch (e) { console.error(e); location.reload(); }
			}
			stamp = m;
		}, 500);

		if (TILE_DECODE_WORKERS > 0) initTilePool(TILE_DECODE_WORKERS);
		boot(false);
	</script>
</body>
</html>
