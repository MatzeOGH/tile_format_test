<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>tile format test</title></title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
		canvas { display: block; width: 100vw; height: 100vh; }
		#ab { position: fixed; top: 10px; right: 10px; display: flex; flex-direction: column;
			align-items: stretch; gap: 3px; max-height: 96vh; overflow-y: auto; font-family: sans-serif; }
		#ab button { padding: 4px 10px; border: 1px solid #555; background: #222; color: #ccc;
			cursor: pointer; border-radius: 4px; font-size: 12px; text-align: left; }
		#ab button.active { background: #2a7; color: #000; border-color: #2a7; font-weight: bold; }
		#ab .sep { height: 1px; width: auto; background: #444; margin: 3px 0; }
		#stats, #metrics { position: fixed; margin: 0; padding: 10px 14px;
			background: rgba(0,0,0,0.72); color: #cfe; font: 12px/1.55 ui-monospace, monospace;
			border-radius: 6px; white-space: pre; }
		#stats { top: 10px; left: 10px; }
		#metrics { bottom: 10px; left: 10px; }
		#stats[hidden], #metrics[hidden] { display: none; }
		/* load-stats comparison widget: persisted per-format stats across reloads (localStorage) */
		#compare { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
			max-width: 90vw; max-height: 80vh; overflow: auto; z-index: 10;
			padding: 14px 16px; background: rgba(0,0,0,0.9); color: #cfe;
			border: 1px solid #444; border-radius: 8px;
			font: 12px/1.5 ui-monospace, monospace; }
		#compare[hidden] { display: none; }
		#compare .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
		#compare .head b { color: #fff; font-size: 13px; }
		#compare .head .grow { flex: 1; }
		#compare .head button { padding: 3px 10px; border: 1px solid #555; background: #222;
			color: #ccc; cursor: pointer; border-radius: 4px; font: inherit; }
		#compare table { border-collapse: collapse; }
		#compare th, #compare td { padding: 4px 10px; text-align: right; white-space: nowrap; }
		#compare th { color: #9ab; border-bottom: 1px solid #444; font-weight: normal; }
		#compare td.fmt, #compare th.fmt { text-align: left; color: #cde; }
		#compare tr.cat td { color: #7bd; padding-top: 10px; text-align: left;
			font-weight: bold; letter-spacing: .04em; }
		#compare tr.cur td.fmt { color: #2fa; font-weight: bold; }
		#compare td .mm { display: block; color: #789; font-size: 10px; }
		#compare td.best .v { color: #4f8; font-weight: bold; }
		#compare .empty { color: #9ab; padding: 6px 2px; }
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<!-- format toggle: reloads with ?src=<key>. Every button loads the SAME 4x4 tile block in one
	     encoding; the stats panel reports its fetch/decode/upload for load-speed + quality compare.
	     data-src values ARE the keys in `formats` (tiles.odin) / TILE_FORMATS (below). -->
	<div id="ab">
		<button data-src="avif" title="browser AVIF baseline">AVIF</button>
		<button data-src="jpeg" title="browser JPEG baseline">JPEG</button>
		<button data-src="jpeg-cdn" title="live basemap.at JPEG (CDN)">JPEG CDN</button>
		<span class="sep"></span>
		<button data-src="etc1s" title="KTX2 BasisLZ/ETC1S">ETC1S</button>
		<button data-src="etc1s_q192" title="ETC1S quality 192">ETC1S q192</button>
		<button data-src="etc1s_q255" title="ETC1S quality 255">ETC1S q255</button>
		<button data-src="uastc4x4" title="UASTC LDR 4x4">UASTC</button>
		<button data-src="uastc4x4_rdo" title="UASTC 4x4 + RDO">UASTC rdo</button>
		<span class="sep"></span>
		<button data-src="xuastc4x4" title="XUASTC 4x4">XUASTC 4×4</button>
		<button data-src="xuastc5x5" title="XUASTC 5x5">XUASTC 5×5</button>
		<button data-src="xuastc6x6" title="XUASTC 6x6">XUASTC 6×6</button>
		<button data-src="xuastc6x6_q75" title="XUASTC 6x6 q75">XUASTC 6×6 q75</button>
		<button data-src="xuastc8x8" title="XUASTC 8x8">XUASTC 8×8</button>
		<button data-src="xuastc8x8_q75" title="XUASTC 8x8 q75">XUASTC 8×8 q75</button>
		<button data-src="xuastc10x10" title="XUASTC 10x10">XUASTC 10×10</button>
		<button data-src="xuastc12x12" title="XUASTC 12x12">XUASTC 12×12</button>
		<span class="sep"></span>
		<button data-src="xubc7" title="XUASTC -> BC7">XUBC7</button>
		<button data-src="xubc7_q40" title="XUBC7 q40">XUBC7 q40</button>
		<button data-src="xubc7_q75" title="XUBC7 q75">XUBC7 q75</button>
		<span class="sep"></span>
		<button id="compareBtn" title="Compare saved load stats across reloads">Compare</button>
		<span class="sep"></span>
		<button id="cacheBtn">Cache: OFF</button>
		<!-- view: snap to exact 1:1 pixel-to-texel (artefact inspection), or re-fit -->
		<button id="oneToOneBtn" title="1 texel = 1 device pixel (key 1)">1:1</button>
		<button id="fitBtn" title="Fit the whole block (key 0)">Fit</button>
	</div>
	<!-- tile stats panel, revealed by the Odin scheduler once the block finishes loading -->
	<pre id="stats" hidden></pre>
	<!-- JS-side fetch/decode totals + averages, computed in tile_upload as tiles complete -->
	<pre id="metrics" hidden></pre>
		<!-- load-stats comparison: reads the localStorage history written by recordTileStats,
		     grouped by category and format. Toggled by #compareBtn. -->
		<div id="compare" hidden>
			<div class="head">
				<b>Load-stats comparison</b>
				<span id="compareSummary"></span>
				<span class="grow"></span>
				<button id="compareClear" title="Delete all saved runs">Clear</button>
				<button id="compareClose" title="Close">✕</button>
			</div>
			<div id="compareBody"></div>
		</div>
	<script>
		// The tile formats, in the SAME order as `formats` in tiles.odin -- index = what
		// tile_format() returns. Each value is a ?src= key and a #ab button's data-src. Keep the
		// two lists in lockstep when adding an encoding.
		const TILE_FORMATS = [
			"avif", "jpeg", "jpeg-cdn",
			"etc1s", "etc1s_q192", "etc1s_q255",
			"uastc4x4", "uastc4x4_rdo",
			"xuastc4x4", "xuastc5x5", "xuastc6x6", "xuastc6x6_q75",
			"xuastc8x8", "xuastc8x8_q75", "xuastc10x10", "xuastc12x12",
			"xubc7", "xubc7_q40", "xubc7_q75",
		];

		// mark the active source and wire the buttons to reload with the query param.
		// the &cached flag is carried across reloads so switching source keeps cache mode.
		(() => {
			const params = new URLSearchParams(location.search);
			const raw = params.get("src");
			// avif (index 0) is the default; any other known format highlights its own button.
			const cur = TILE_FORMATS.includes(raw) ? raw : "avif";
			const cached = params.has("cached");
			// Build the search string for a source, preserving the cached flag and the CURRENT
			// view. flushView() (defined in the wasm script) commits any pending debounced zoom
			// to the URL first, then we read `view` live -- capturing it at load would carry a
			// stale zoom across the switch.
			const search = (src, isCached) => {
				flushView();
				const view = new URLSearchParams(location.search).get("view");
				return "?src=" + src + (isCached ? "&cached" : "") + (view ? "&view=" + encodeURIComponent(view) : "");
			};

			for (const b of document.querySelectorAll("#ab button[data-src]")) {
				if (b.dataset.src === cur) b.classList.add("active");
				b.onclick = () => { location.search = search(b.dataset.src, cached); };
			}
			// cache toggle: reload with/without &cached, keeping the current source
			const cb = document.getElementById("cacheBtn");
			if (cached) cb.classList.add("active");
			cb.textContent = cached ? "Cache: ON" : "Cache: OFF";
			cb.onclick = () => { location.search = search(cur, !cached); };
		})();
	</script>
	<script>
		// ---- Load-stats comparison widget -------------------------------------------------
		// Each page load renders ONE format (?src=), so a single run's stats only ever describe
		// that format. recordTileStats() stashes every run's numbers in localStorage keyed by
		// format; the Compare panel stacks them so reloading through several formats builds a
		// side-by-side table -- grouped by category, with min/avg/max per metric across runs.

		const STATS_KEY = "odin_tile_stats";

		// Categories aren't encoded in tiles.odin -- derive from the format key prefix. Order
		// here fixes the row order in the widget.
		const CATEGORY_ORDER = ["Baseline", "ETC1S", "UASTC", "XUASTC", "XUBC7"];
		function categoryOf(key) {
			if (key === "avif" || key === "jpeg" || key === "jpeg-cdn") return "Baseline";
			if (key.startsWith("etc1s"))  return "ETC1S";
			if (key.startsWith("uastc"))  return "UASTC";
			if (key.startsWith("xuastc")) return "XUASTC";
			if (key.startsWith("xubc7"))  return "XUBC7";
			return "Baseline";
		}
		// Current format from the URL -- same defaulting as the button IIFE (avif when absent).
		function currentSrc() {
			const raw = new URLSearchParams(location.search).get("src");
			return TILE_FORMATS.includes(raw) ? raw : "avif";
		}

		// store shape: { [formatKey]: [ {k,f,d,t}, ... ] }  (one object per run)
		//   k = download KiB   f = fetch avg ms   d = decode avg ms   t = wall-clock total ms
		function readStore() {
			try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }
			catch { return {}; }
		}
		function writeStore(store) {
			try { localStorage.setItem(STATS_KEY, JSON.stringify(store)); }
			catch (e) { console.warn("stats persist failed", e); } // quota etc. -- never break the page
		}

		// Parse the compact #stats block (see print_stats in tiles.odin). Label-anchored so the
		// optional "⚠ ...\n" warning prefix on the RGBA-fallback path doesn't shift anything.
		function parseStats(text) {
			const num = re => { const m = text.match(re); return m ? parseFloat(m[1]) : null; };
			return {
				k: num(/([\d.]+)\s*KiB/),
				f: num(/fetch:\s+avg\s+([\d.]+)\s*ms/),
				d: num(/decode:\s+avg\s+([\d.]+)\s*ms/),
				t: num(/total:\s+([\d.]+)\s*ms/),
			};
		}

		// Called from tiles_stats once a block finishes loading.
		function recordTileStats(text) {
			const s = parseStats(text);
			// Skip if nothing parsed (guards against a format-string change upstream).
			if (s.k == null && s.f == null && s.d == null && s.t == null) return;
			const store = readStore();
			(store[currentSrc()] ||= []).push(s);
			writeStore(store);
			if (!document.getElementById("compare").hidden) renderCompare();
		}

		// ---- rendering ----
		const fmt = (v, dp) => (v == null ? "–" : v.toFixed(dp));
		function agg(runs, field) { // -> {avg,min,max} over the runs that have this field
			const xs = runs.map(r => r[field]).filter(v => v != null);
			if (!xs.length) return null;
			const sum = xs.reduce((a, b) => a + b, 0);
			return { avg: sum / xs.length, min: Math.min(...xs), max: Math.max(...xs) };
		}
		// One metric column: <field key>, heading, decimal places.
		const METRICS = [
			{ key: "k", label: "KiB",       dp: 1 },
			{ key: "f", label: "Fetch ms",  dp: 1 },
			{ key: "d", label: "Decode ms", dp: 1 },
			{ key: "t", label: "Total ms",  dp: 0 },
		];

		function renderCompare() {
			const store = readStore();
			const body = document.getElementById("compareBody");
			const summary = document.getElementById("compareSummary");
			const keys = Object.keys(store).filter(k => store[k] && store[k].length);
			const totalRuns = keys.reduce((n, k) => n + store[k].length, 0);
			summary.textContent = keys.length
				? `${keys.length} formats · ${totalRuns} runs · lower is better`
				: "";

			if (!keys.length) {
				body.innerHTML =
					'<div class="empty">No runs captured yet — reload through some formats (the AVIF/JPEG/… buttons), then reopen this panel.</div>';
				return;
			}

			// Best (lowest) avg per metric across ALL formats -> highlight the winner cell.
			const best = {};
			for (const m of METRICS) {
				let b = Infinity;
				for (const k of keys) { const a = agg(store[k], m.key); if (a && a.avg < b) b = a.avg; }
				best[m.key] = b;
			}

			const cur = currentSrc();
			let html = "<table><thead><tr><th class='fmt'>Format</th><th>Runs</th>" +
				METRICS.map(m => `<th>${m.label}</th>`).join("") + "</tr></thead><tbody>";

			for (const cat of CATEGORY_ORDER) {
				// formats in this category that have data, kept in TILE_FORMATS order
				const rows = TILE_FORMATS.filter(k => categoryOf(k) === cat && store[k] && store[k].length);
				if (!rows.length) continue;
				html += `<tr class="cat"><td colspan="${METRICS.length + 2}">${cat}</td></tr>`;
				for (const k of rows) {
					const runs = store[k];
					const cls = k === cur ? ' class="cur"' : "";
					html += `<tr${cls}><td class="fmt">${k}</td><td>${runs.length}</td>`;
					for (const m of METRICS) {
						const a = agg(runs, m.key);
						if (!a) { html += "<td>–</td>"; continue; }
						const isBest = Math.abs(a.avg - best[m.key]) < 1e-9;
						const mm = runs.length > 1 ? `<span class="mm">${fmt(a.min, m.dp)}–${fmt(a.max, m.dp)}</span>` : "";
						html += `<td class="${isBest ? "best" : ""}"><span class="v">${fmt(a.avg, m.dp)}</span>${mm}</td>`;
					}
					html += "</tr>";
				}
			}
			html += "</tbody></table>";
			body.innerHTML = html;
		}

		// ---- wiring ----
		(() => {
			const panel = document.getElementById("compare");
			document.getElementById("compareBtn").onclick = () => {
				panel.hidden = !panel.hidden;
				if (!panel.hidden) renderCompare();
			};
			document.getElementById("compareClose").onclick = () => { panel.hidden = true; };
			document.getElementById("compareClear").onclick = () => {
				localStorage.removeItem(STATS_KEY);
				renderCompare();
			};
		})();
	</script>
	<!-- Odin js_wasm32 runtime: runWasm + WasmMemoryInterface (attached to window.odin) -->
	<script src="odin.js"></script>
	<!-- vendor:wgpu web backend: WebGPUInterface (browser WebGPU), also on window.odin -->
	<script src="wgpu.js"></script>
	<script>
		if (!navigator.gpu) {
			document.body.innerHTML =
				"<p style='color:#eee;font-family:sans-serif'>WebGPU is not available in this browser.</p>";
			throw new Error("WebGPU not supported");
		}
		// Shared memory interface between the Odin runtime and the wgpu backend.
		const wmi = new odin.WasmMemoryInterface();
		const webgpu = new odin.WebGPUInterface(wmi);
		// JS owns the linear memory (engine.wasm is built with --import-memory) and the
		// wgpu interface, so both survive re-instantiation -> app state + GPU handles persist
		// across a hot swap. Bump `initial` if instantiation throws a memory-minimum error.
		const memory = new WebAssembly.Memory({ initial: 1024, maximum: 16384 });
		wmi.setMemory(memory);

		let hotReload = false;
		let webfileBuf = null; // bytes staged between webfile_fetch and webfile_copy
		const webfileStash = {}; // id -> Uint8Array, staged between async fetch resolve and webfile_drain


		// Per-run accumulators for the #metrics panel. Totals are summed work (each tile's
		// duration added up) -- with tiles fetching/decoding concurrently the sums exceed
		// wall-clock elapsed, so read the averages as the per-tile cost. Reset each (re)boot.
		let fetchTotal = 0, decodeTotal = 0, tileCount = 0;
		function renderTileMetrics() {
			const el = document.getElementById("metrics");
			if (!el || !tileCount) return;
			const favg = (fetchTotal / tileCount).toFixed(2);
			const davg = (decodeTotal / tileCount).toFixed(2);
			el.textContent =
				`tiles   ${tileCount}\n` +
				`fetch   total ${fetchTotal.toFixed(1)} ms   avg ${favg} ms\n` +
				`decode  total ${decodeTotal.toFixed(1)} ms   avg ${davg} ms`;
			el.hidden = false;
		}

		// ?cached (or &cached) switches tile fetches from no-store to the browser HTTP cache.
		// First load with the flag warms the cache (network); reload with it to measure the
		// cache-hit path. Only the fetch phase changes -- decode/upload cost stays the same --
		// so the stats panel's fetch time is the number that should drop. no-store elsewhere
		// (wasm, webfiles) is left alone on purpose.
		const TILES_CACHED = new URLSearchParams(location.search).has("cached");

		// Saved mosaic view from ?view=panX,panY,scale -- restored by the Odin scheduler on
		// boot (see view_saved* imports). null if absent or malformed.
		const savedView = (() => {
			const v = new URLSearchParams(location.search).get("view");
			if (!v) return null;
			const [x, y, s] = v.split(",").map(Number);
			return (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(s) && s > 0)
				? { x, y, s } : null;
		})();

		// Persist the view to the URL, throttled: Odin calls scheduleViewSave on every pan/zoom
		// (many per drag), so debounce the history write and use replaceState (no history spam).
		// flushView() commits the latest immediately -- called before a source/cache switch and
		// on pagehide, so a switch or a quick reload never drops the most recent zoom.
		let pendingView = null, viewTimer = 0;
		function flushView() {
			if (!pendingView) return;
			if (viewTimer) { clearTimeout(viewTimer); viewTimer = 0; }
			const u = new URL(location.href);
			u.searchParams.set("view", pendingView);
			history.replaceState(null, "", u);
			pendingView = null;
		}
		function scheduleViewSave(x, y, scale) {
			pendingView = x.toFixed(2) + "," + y.toFixed(2) + "," + scale.toFixed(4);
			if (viewTimer) return;
			viewTimer = setTimeout(() => { viewTimer = 0; flushView(); }, 100);
		}
		addEventListener("pagehide", flushView); // keep the latest zoom on reload/close

		// Cache ImageDecoder.isTypeSupported() per mime type: one probe, reused for every
		// tile of that type. Resolves false when WebCodecs is unavailable or the type is
		// unsupported, so tile_upload can fall back to createImageBitmap.
		const decoderSupport = {};
		function canDecode(type) {
			if (!type || !("ImageDecoder" in window)) return Promise.resolve(false);
			if (!(type in decoderSupport))
				decoderSupport[type] = ImageDecoder.isTypeSupported(type).catch(() => false);
			return decoderSupport[type];
		}

		const imports = {
			...odin.setupDefaultImports(wmi, null, memory),
			wgpu: webgpu.getInterface(),
			hot: { is_reload: () => (hotReload ? 1 : 0) }, // read by Odin's foreign `is_reload`
			webfile: {
				// Synchronous XHR of a server-local path. Stashes bytes, returns length (-1 on error).
				// Sync XHR forbids responseType="arraybuffer", so read binary via the
				// x-user-defined charset trick and mask each char back to a byte.
				webfile_fetch: (ptr, len) => {
					const path = wmi.loadString(ptr, len);
					try {
						const xhr = new XMLHttpRequest();
						xhr.open("GET", path, false); // false = synchronous
						xhr.overrideMimeType("text/plain; charset=x-user-defined");
						xhr.send();
						if (xhr.status !== 200 && xhr.status !== 0) { webfileBuf = null; return -1; }
						const s = xhr.responseText;
						const b = new Uint8Array(s.length);
						for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xff;
						webfileBuf = b;
						return b.length;
					} catch (e) { console.error("webfile_fetch", path, e); webfileBuf = null; return -1; }
				},
				// buf: []byte arrives as (ptr, len) -- fill it from the stash, then clear.
				webfile_copy: (ptr, len) => {
					wmi.loadU8Array(ptr, len).set(webfileBuf);
					webfileBuf = null;
				},
				// Async fetch; on settle, stash bytes by id and call the wasm trampoline
				// (JS appends ctxPtr, like step). wmi.exports/ctxPtr are read live, so after
				// a hot swap this hits the new instance -- which drops unknown ids.
				webfile_request: (id, ptr, len) => {
					const path = wmi.loadString(ptr, len);
					fetch(path, { cache: "no-store" })
						.then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
						.then(buf => {
							const b = new Uint8Array(buf);
							webfileStash[id] = b;
							wmi.exports.webfile_deliver(id, b.length, 1, ctxPtr);
							delete webfileStash[id];
						})
						.catch(e => {
							console.error("webfile_request", path, e);
							wmi.exports.webfile_deliver(id, 0, 0, ctxPtr);
						});
				},
				// Copy the stashed async bytes for `id` into buf (called during deliver).
				webfile_drain: (id, ptr, len) => {
					wmi.loadU8Array(ptr, len).set(webfileStash[id]);
				},
			},
			tiles: {
				// fetch a tile, decode it off the main thread, and copy it straight into the
				// Odin-created texture array -- pixels never touch wasm. texId/queueId are
				// wgpu.js object ids; resolve them via the object managers.
				//
				// Decode path: WebCodecs ImageDecoder -> VideoFrame when the browser can decode
				// the tile's mime type (native dav1d for AVIF, no wasm), which moves the decode
				// cost off the timed JS path and lets copyExternalImageToTexture take a VideoFrame
				// directly. Falls back to createImageBitmap for unsupported types / no WebCodecs,
				// preserving the origin-clean cross-origin upload for OSM/basemap tiles.
				// NOTE: VideoFrame decodes to BGRA8; if the destination texture array is RGBA8,
				// the upload pays a swizzle. Match the texture format to bgra8unorm(-srgb) on the
				// Odin side to hit the memcpy fast path.
				tile_upload: (id, urlPtr, urlLen, texId, queueId, layer) => {
					const url = wmi.loadString(urlPtr, urlLen);
					// Time each phase (ms) and report them + byte size back to the Odin scheduler,
					// which aggregates the stats. Phases: fetch (network), decode, upload.
					const t0 = performance.now();
					let bytes = 0, tFetch = 0;
					// no-store by default; ?cached -> force-cache so a warmed reload is served
					// from the browser HTTP cache and the fetch phase collapses.
					fetch(url, { cache: TILES_CACHED ? "force-cache" : "no-store" })
						.then(r => r.ok
							? r.arrayBuffer().then(buf => ({ buf, ct: r.headers.get("content-type") }))
							: Promise.reject(r.status))
						.then(async ({ buf, ct }) => {
							tFetch = performance.now() - t0;
							bytes = buf.byteLength;
							const data = new Uint8Array(buf);

							// Pick a mime type ImageDecoder understands: prefer the response
							// header, else infer from the URL extension.
							let type = (ct && ct.startsWith("image/")) ? ct.split(";")[0].trim() : "";
							if (!type) {
								if (/\.avif(\?|$)/i.test(url)) type = "image/avif";
								else if (/\.jpe?g(\?|$)/i.test(url)) type = "image/jpeg";
								else if (/\.png(\?|$)/i.test(url)) type = "image/png";
								else if (/\.webp(\?|$)/i.test(url)) type = "image/webp";
							}

							const t1 = performance.now();
							let source, decodeMs, cleanup;

							if (await canDecode(type)) {
								// Fast path: decode off-thread on the browser's codec threads.
								console.log("Decode Fast path");
								performance.mark("decode-start");
								const dec = new ImageDecoder({ data, type });
								const { image: frame } = await dec.decode();
								performance.mark("decode-end");
								performance.measure("image-decode", "decode-start", "decode-end");
								decodeMs = performance.now() - t1;
								source = frame;
								cleanup = () => { frame.close(); dec.close(); };
							} else {
								// Fallback: createImageBitmap from a Blob. colorSpaceConversion:"none"
								// stops Chrome from applying ICC/color management on decode -- we want
								// the raw sRGB tile bytes; the sRGB texture format handles the decode.
								// (See Castano, "Image Loading on the Web".)
								const blob = new Blob([data], { type: type || undefined });
								const bmp = await createImageBitmap(blob,
									{ colorSpaceConversion: "none", premultiplyAlpha: "none", imageOrientation: "none" });
								decodeMs = performance.now() - t1;
								source = bmp;
								cleanup = () => bmp.close();
							}

							const tex = webgpu.textures.get(texId);
							const queue = webgpu.queues.get(queueId);
							// VideoFrame exposes displayWidth/Height; ImageBitmap exposes width/height.
							const w = source.displayWidth ?? source.width;
							const h = source.displayHeight ?? source.height;
							queue.copyExternalImageToTexture(
								{ source },
								{ texture: tex, origin: [0, 0, layer] },
								[w, h, 1]);
							cleanup();
							// Upload time is not tracked for the browser path -- report 0.
							fetchTotal += tFetch; decodeTotal += decodeMs; tileCount++;
							renderTileMetrics();
							wmi.exports.tile_uploaded(id, 1, bytes, tFetch, decodeMs, 0, ctxPtr);
						})
						.catch(e => {
							console.error("tile_upload", url, e);
							wmi.exports.tile_uploaded(id, 0, 0, 0, 0, 0, ctxPtr);
						});
				},
				// Format select from ?src=: index into TILE_FORMATS (== `formats` in tiles.odin), or
				// -1 -> Odin defaults to 0 (avif). Every #ab button's data-src is one of these keys.
				tile_format: () => TILE_FORMATS.indexOf(new URLSearchParams(location.search).get("src")),
				// The Odin scheduler calls this with the formatted stats block once the tile block
				// finishes loading; reveal the on-page panel.
				tiles_stats: (ptr, len) => {
					const el = document.getElementById("stats");
					el.textContent = wmi.loadString(ptr, len);
					el.hidden = false;
					// Persist this run's numbers (parsed from the same block) so the Compare
					// widget can stack them across reloads. Defined in the widget script below.
					recordTileStats(el.textContent);
				},
				// Real monotonic clock (ms). Used for the block's wall-clock "total" (tiles_now(end) -
				// tiles_now(start)) AND by the wasm KTX path to time its decode + upload phases.
				tiles_now: () => performance.now(),
			},
			// Shared pan/zoom view (package view): Odin pushes the current view here (throttled to
			// the URL) and reads any ?view= back through these getters on boot.
			view: {
				view_persist: (x, y, scale) => scheduleViewSave(x, y, scale),
				view_saved:   () => savedView ? 1 : 0,
				view_saved_x: () => savedView ? savedView.x : 0,
				view_saved_y: () => savedView ? savedView.y : 0,
				view_saved_s: () => savedView ? savedView.s : 1,
			},
		};

		// One persistent RAF loop across all module swaps; it always calls the *current*
		// instance via wmi.exports. odin.js's env callbacks read wmi.exports live too, so
		// setExports() repoints every host callback at the new instance.
		let ctxPtr = 0, rafId = 0, prev;
		function loop(t) {
			if (prev === undefined) prev = t;
			const dt = (t - prev) * 0.001; prev = t;
			wmi.exports.step(dt, ctxPtr);
			rafId = requestAnimationFrame(loop);
		}

		async function boot(hot) {
			hotReload = hot;
			fetchTotal = 0; decodeTotal = 0; tileCount = 0; // reset the metrics-panel accumulators
			{ const m = document.getElementById("metrics"); if (m) m.hidden = true; }
			const bytes = await (await fetch("engine.wasm", { cache: "no-store" })).arrayBuffer();
			// Serialize the persistent State out of the OLD instance before we throw it
			// away. One blob, serialized by field name (survives layout changes) -- the gpu
			// handles ride inside it now, same as the native host across a DLL swap.
			let savedState = null;
			if (hot) {
				const e = wmi.exports;
				const n = e.state_save(ctxPtr); // serialize State (gpu included) in the old instance
				savedState = wmi.loadU8Array(e.state_save_ptr(ctxPtr), n).slice();
			}
			const { instance } = await WebAssembly.instantiate(bytes, imports);
			ctxPtr = instance.exports.default_context_ptr();
			wmi.setExports(instance.exports);
			instance.exports._start(); // Odin init + main -> run() (bails early if hot)
			// Steps below run synchronously after _start (no await), so no RAF frame sees a
			// half-restored persist.
			if (hot) {
				const e = instance.exports;
				// State (gpu handles included) is remapped by field name, so a layout change
				// needs no guard -- new fields default, the opaque wgpu ids copy through.
				const buf = e.state_load_buf(savedState.length, ctxPtr);
				wmi.loadU8Array(buf, savedState.length).set(savedState);
				e.state_load(ctxPtr);
				e.hot_resume(ctxPtr);
			}
			if (!rafId) rafId = requestAnimationFrame(loop);
		}

		// dev livereload: swap the module in place when engine.wasm changes (served by serve.py).
		// ponytail: harmless in prod -- a HEAD every 500ms that never triggers a swap. Strip if it bugs you.
		const WASM_HOT_RELOAD = false; // toggle dev livereload
		let stamp;
		if (WASM_HOT_RELOAD) setInterval(async () => {
			const m = (await fetch("engine.wasm", { method: "HEAD", cache: "no-store" }))
				.headers.get("Last-Modified");
			if (stamp && m !== stamp) {
				// Drop stale window listeners (they hold the old instance's callback indices);
				// the new run()/hot_resume re-adds them against the fresh instance.
				for (const [k, l] of wmi.listenerMap) {
					window.removeEventListener(k.split("-data:")[0].split("-").slice(1).join("-"), l);
				}
				wmi.listenerMap.clear();
				try { await boot(true); } catch (e) { console.error(e); location.reload(); }
			}
			stamp = m;
		}, 500);

		// Mosaic view buttons -> exported Odin procs (JS appends ctxPtr, like step). Handlers
		// read wmi.exports live, so they hit the current instance after a hot swap.
		document.getElementById("oneToOneBtn").onclick = () => wmi.exports.view_snap_1to1(ctxPtr);
		document.getElementById("fitBtn").onclick      = () => wmi.exports.view_reset(ctxPtr);

		boot(false);
	</script>
</body>
</html>
